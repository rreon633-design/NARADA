[workspace]
resolver = "2"
members = ["crates/narada-protocol", "crates/narada-core", "crates/narada-ipc", "crates/narada-connection", "crates/narada-files", "apps/windows-agent", "apps/desktop-shell/src-tauri"]
default-members = ["crates/narada-protocol", "crates/narada-core", "crates/narada-ipc", "crates/narada-connection", "crates/narada-files", "apps/windows-agent"]

[workspace.package]
version = "0.7.1"
edition = "2021"
rust-version = "1.99"
license = "LicenseRef-Proprietary"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "sync", "time", "fs", "process"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
directories = "6"
fs2 = "0.4"
toml = "0.9"
tempfile = "3"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_Memory", "Win32_Security_Cryptography"] }

# Lightweight native binaries; retain unwinding for existing failure boundaries.
[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
debug = 0
panic = "unwind"
