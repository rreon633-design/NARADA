name: CI failure diagnostics
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ['Test, build and publish manual-test candidates']
    types: [completed]
permissions:
  contents: read
  actions: read
jobs:
  diagnostics:
    if: github.repository == 'rreon633-design/NARADA' && (github.event_name == 'push' || github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Expose bounded diagnostic annotations without an external API credential
        env:
          GH_TOKEN: ${{ github.token }}
          DIAGNOSTIC_RUN_ID: ${{ github.event.workflow_run.id }}
        run: python scripts/ci/diagnostics.py
