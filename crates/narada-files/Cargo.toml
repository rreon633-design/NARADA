[package]
name = "narada-files"
version.workspace = true
edition.workspace = true
license.workspace = true
[dependencies]
narada-core = { path = "../narada-core" }
narada-protocol = { path = "../narada-protocol" }
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tokio.workspace = true
chrono.workspace = true
uuid.workspace = true
fs2.workspace = true
zeroize = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
unicode-normalization = "0.1"
notify = "8"
[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "1", features = ["fs"] }
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_WindowsProgramming", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading"] }
[dev-dependencies]
tempfile.workspace = true
