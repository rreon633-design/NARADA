[package]
name = "narada-connection"
version.workspace = true
edition.workspace = true
license.workspace = true
[features]
default = []
dev-vault = ["dep:aes-gcm"]
[dependencies]
narada-files = { path = "../narada-files" }
narada-core = { path = "../narada-core" }
narada-protocol = { path = "../narada-protocol" }
fs2.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tokio.workspace = true
chrono.workspace = true
uuid.workspace = true
tracing.workspace = true
tempfile.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
x509-parser = { version = "0.18", features = ["verify"] }
ring = "0.17"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
subtle = "2"
zeroize = { version = "1", features = ["derive"] }
time = "0.3"
aes-gcm = { version = "0.10", optional = true }
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
tokio-util = { version = "0.7", features = ["rt"] }
mdns-sd = "0.17"
if-addrs = "0.14"
vodozemac = { version = "=0.11.1", default-features = false }
age = { version = "=0.12.1", default-features = false }
[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
